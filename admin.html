<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<style>
body { font-family: monospace; background: #111; color: white; padding: 20px; }
button { padding: 8px 12px; margin: 5px; cursor: pointer; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { padding: 8px; border: 1px solid #333; }
th { background: #222; }
</style>
</head>
<body>

<h1>Admin Dashboard</h1>
<p>Total Visitors: <span id="totalViews">0</span></p>
<button onclick="fetchDashboard()">Refresh</button>
<button onclick="resetVisitors()">Reset Visitors</button>

<h2>Recent Visitors (last 50)</h2>
<table>
  <thead>
    <tr>
      <th>IP</th>
      <th>Timestamp</th>
      <th>User Agent</th>
    </tr>
  </thead>
  <tbody id="visitorTable"></tbody>
</table>

<script>
const token = localStorage.getItem("adminToken"); // must be logged in

async function fetchDashboard() {
    if (!token) return alert("Missing admin token");

    try {
        const res = await fetch("https://wma-backend.onrender.com/api/admin/dashboard", {
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();

        if (!data.success) return alert("Error: " + data.error);

        document.getElementById("totalViews").textContent = data.totalViews;

        const tbody = document.getElementById("visitorTable");
        tbody.innerHTML = "";
        data.recentVisitors.forEach(v => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${v.ip}</td><td>${new Date(v.timestamp).toLocaleString()}</td><td>${v.userAgent}</td>`;
            tbody.appendChild(tr);
        });
    } catch (err) {
        alert("Failed to fetch dashboard");
    }
}

async function resetVisitors() {
    if (!token) return alert("Missing admin token");
    if (!confirm("Reset all visitors?")) return;

    try {
        const res = await fetch("https://wma-backend.onrender.com/api/admin/reset", {
            method: "POST",
            headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        if (!data.success) return alert("Error: " + data.error);
        fetchDashboard();
    } catch (err) {
        alert("Failed to reset visitors");
    }
}

// initial fetch
fetchDashboard();
</script>

</body>
</html>
