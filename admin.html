<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
body { font-family: monospace; background: #111; color: #fff; padding: 20px; }
h1 { color: #0f0; }
table { border-collapse: collapse; width: 100%; margin-top: 20px; }
th, td { border: 1px solid #555; padding: 8px; text-align: left; }
th { background: #222; }
</style>
</head>
<body>

<h1>Admin Panel</h1>
<p>Total Visitors: <span id="views">Loading...</span></p>

<h2>Uploaded Files</h2>
<table>
<thead>
<tr><th>Filename</th><th>Download</th></tr>
</thead>
<tbody id="filesTable">
<tr><td colspan="2">Loading...</td></tr>
</tbody>
</table>

<script>
const token = localStorage.getItem("adminToken"); // Token set after login on index.html

async function fetchStats() {
    const res = await fetch("/api/stats", {
        headers: { "Authorization": `Bearer ${token}` }
    });
    if(res.ok) {
        const data = await res.json();
        document.getElementById("views").textContent = data.views;

        const table = document.getElementById("filesTable");
        table.innerHTML = "";
        if(data.files.length === 0) {
            table.innerHTML = "<tr><td colspan='2'>No files uploaded</td></tr>";
        } else {
            data.files.forEach(file => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${file}</td>
                                <td><a href="/api/download/${encodeURIComponent(file)}" target="_blank">Download</a></td>`;
                table.appendChild(tr);
            });
        }
    } else {
        document.getElementById("views").textContent = "Error fetching stats";
    }
}

fetchStats();
</script>

</body>
</html>
