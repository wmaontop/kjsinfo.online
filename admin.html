<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel</title>
<style>
/* Admin Button */
.admin-btn{position:fixed;right:20px;bottom:90px;padding:10px 18px;background:rgba(255,255,255,0.1);color:white;border:none;border-radius:10px;font-family:monospace;cursor:pointer;z-index:9999;transition:.2s;}
.admin-btn:hover{background:rgba(255,255,255,0.25);}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:99999;justify-content:center;align-items:center;}
.modal-content{background:rgba(0,0,0,0.85);padding:30px;width:320px;border-radius:15px;text-align:center;color:white;font-family:monospace;box-shadow:0 0 20px rgba(0,0,0,0.5);animation:pop .2s ease;}
@keyframes pop{from{transform:scale(0.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-content input{width:90%;padding:10px;margin-bottom:10px;border-radius:8px;border:none;outline:none;background:rgba(255,255,255,0.1);color:white;}
.modal-content button{width:90%;padding:10px;margin-top:5px;background:rgba(255,255,255,0.15);border:none;border-radius:8px;color:white;cursor:pointer;transition:.2s;}
.modal-content button:hover{background:rgba(255,255,255,0.3);}
.close-btn{background:rgba(255,0,0,0.2);}
.close-btn:hover{background:rgba(255,0,0,0.35);}
.error{color:red;font-size:13px;margin-top:5px;} </style>

</head>
<body>

<!-- Admin Modal -->

<div id="adminModal" class="modal">
  <div class="modal-content">
    <h2>Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Password">
    <button onclick="adminLogin()">Login</button>
    <button class="close-btn" onclick="closeAdminLogin()">Close</button>
    <p id="adminError" class="error"></p>
  </div>
</div>

<!-- Admin Button -->

<button class="admin-btn" onclick="openAdminLogin()">Admin</button>

<script>
function openAdminLogin() {
  document.getElementById("adminModal").style.display = "flex";
}
function closeAdminLogin() {
  document.getElementById("adminModal").style.display = "none";
  document.getElementById("adminPassword").value = "";
  document.getElementById("adminError").textContent = "";
}
function adminLogin() {
  const password = document.getElementById("adminPassword").value;
  if(password === "adminpanel123") { // placeholder for frontend-only
    alert("Admin login simulated (frontend only).");
    closeAdminLogin();
  } else {
    document.getElementById("adminError").textContent = "Incorrect password.";
  }
}
</script>

</body>
</html>
