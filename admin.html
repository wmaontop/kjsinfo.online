<!-- Admin Modal -->
<div id="adminModal" class="modal">
  <div class="modal-content">
    <h2>Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Password">
    <button onclick="adminLogin()">Login</button>
    <button class="close-btn" onclick="closeAdminLogin()">Close</button>
    <p id="adminError" class="error"></p>
  </div>
</div>

<!-- Admin Dashboard -->
<div id="adminDashboard" style="display:none; padding:20px; color:white; font-family:monospace;">
    <h2>Admin Dashboard</h2>
    <p>👁️ Total Views: <span id="totalViews">0</span></p>
    <p>📂 Uploaded Files: <span id="fileCount">0</span></p>
    <ul id="fileList"></ul>
</div>

<script>
const backend = "https://wma-backend.onrender.com";

// ---------------- Admin Login ----------------
async function adminLogin() {
    const password = document.getElementById("adminPassword").value;

    try {
        const res = await fetch(`${backend}/api/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password })
        });

        const data = await res.json();

        if(data.success) {
            localStorage.setItem("adminToken", data.token);
            alert("✅ Admin login successful!");
            closeAdminLogin();
            loadStats(); // load views/files after login
            document.getElementById("adminDashboard").style.display = "block";
        } else {
            document.getElementById("adminError").textContent = "Incorrect password.";
        }
    } catch (err) {
        document.getElementById("adminError").textContent = "Error connecting to server.";
        console.error(err);
    }
}

function closeAdminLogin() {
    document.getElementById("adminModal").style.display = "none";
    document.getElementById("adminPassword").value = "";
    document.getElementById("adminError").textContent = "";
}

// ---------------- Load Stats ----------------
async function loadStats() {
    const token = localStorage.getItem("adminToken");
    if(!token) return;

    try {
        const res = await fetch(`${backend}/api/stats`, {
            headers: { "Authorization": `Bearer ${token}` }
        });

        const data = await res.json();

        document.getElementById("totalViews").textContent = data.views;
        document.getElementById("fileCount").textContent = data.fileCount;

        const fileListEl = document.getElementById("fileList");
        fileListEl.innerHTML = "";
        data.files.forEach(file => {
            const li = document.createElement("li");
            li.textContent = file;
            fileListEl.appendChild(li);
        });
    } catch (err) {
        console.error("Error loading stats:", err);
    }
}

// Optional: Auto-refresh stats every 10 seconds
setInterval(loadStats, 10000);
</script>
