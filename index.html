<script>
/* Admin modal */
function openAdminLogin() {
  document.getElementById("adminModal").style.display = "flex";
}
function closeAdminLogin() {
  document.getElementById("adminModal").style.display = "none";
  document.getElementById("adminPassword").value = "";
  document.getElementById("adminError").textContent = "";
}
function adminLogin() {
  const password = document.getElementById("adminPassword").value;
  if(password === "yourpassword") { // placeholder for frontend-only
    alert("Admin login simulated (frontend only).");
    closeAdminLogin();
  } else {
    document.getElementById("adminError").textContent = "Incorrect password.";
  }
}

/* Video & Audio */
const bgVideo = document.getElementById("bgVideo");
const musicAudio = document.getElementById("musicAudio");
const toggleBtn = document.getElementById("toggleBtn");
const songSelector = document.getElementById("songSelector");

const musicList = ["music.mp3","music1.mp3","music2.mp3","music3.mp3","music4.mp3"];
let currentMode = "video";
let currentSong = "music.mp3";

window.addEventListener("load", () => {
  bgVideo.play().catch(()=>console.warn("Autoplay blocked"));
});

document.body.addEventListener("click",()=>{if(currentMode==="video") bgVideo.muted=false},{once:true});

function toggleAudio() {
  if(currentMode==="video"){
    bgVideo.muted=true;
    musicAudio.src="./r2.wya.lol/"+currentSong;
    musicAudio.play();
    currentMode="music";
    toggleBtn.textContent="🎥 Video";
  } else {
    musicAudio.pause();
    bgVideo.muted=false;
    currentMode="video";
    toggleBtn.textContent="🎵 Music";
  }
}
function shuffleMusic() {
  const randomSong = musicList[Math.floor(Math.random()*musicList.length)];
  currentSong=randomSong;
  songSelector.value=randomSong;
  if(currentMode==="music"){
    musicAudio.src="./r2.wya.lol/"+currentSong;
    musicAudio.play();
  }
}
function selectSong(value){
  currentSong=value;
  if(currentMode==="music"){
    musicAudio.src="./r2.wya.lol/"+currentSong;
    musicAudio.play();
  }
}
</script>

<!-- Styles -->

<style>
/* Admin Button */
.admin-btn{position:fixed;right:20px;bottom:90px;padding:10px 18px;background:rgba(255,255,255,0.1);color:white;border:none;border-radius:10px;font-family:monospace;cursor:pointer;z-index:9999;transition:.2s;}
.admin-btn:hover{background:rgba(255,255,255,0.25);}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:99999;justify-content:center;align-items:center;}
.modal-content{background:rgba(0,0,0,0.85);padding:30px;width:320px;border-radius:15px;text-align:center;color:white;font-family:monospace;box-shadow:0 0 20px rgba(0,0,0,0.5);animation:pop .2s ease;}
@keyframes pop{from{transform:scale(0.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-content input{width:90%;padding:10px;margin-bottom:10px;border-radius:8px;border:none;outline:none;background:rgba(255,255,255,0.1);color:white;}
.modal-content button{width:90%;padding:10px;margin-top:5px;background:rgba(255,255,255,0.15);border:none;border-radius:8px;color:white;cursor:pointer;transition:.2s;}
.modal-content button:hover{background:rgba(255,255,255,0.3);}
.close-btn{background:rgba(255,0,0,0.2);}
.close-btn:hover{background:rgba(255,0,0,0.35);}
.error{color:red;font-size:13px;margin-top:5px;}

/* Video Background */
.background{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-1;pointer-events:none;background:black;}

/* Links */
.links-container .logo{display:inline-block;margin:6px;cursor:pointer;transition:transform .2s ease;}
.links-container .logo:hover{transform:scale(1.15);}

/* Audio Controls */
.audio-controls{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:12px;background:rgba(0,0,0,0.55);padding:10px 18px;border-radius:14px;color:white;font-family:monospace;align-items:center;z-index:9999;backdrop-filter:blur(6px);box-shadow:0 0 12px rgba(0,0,0,0.4);}
.audio-controls button,.audio-controls select{background:rgba(255,255,255,0.1);border:none;color:white;font-family:monospace;padding:6px 10px;border-radius:8px;cursor:pointer;transition:background .3s ease;}
.audio-controls button:hover,.audio-controls select:hover{background:rgba(255,255,255,0.25);}
</style>
